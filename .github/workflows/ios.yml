name: iOS compile check
on:
  push:
    branches: [ios]
  pull_request:
    branches: [ios]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Bundle the app
        run: ios/sync-app.sh site/app
      - name: Build for the simulator without signing
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -workspace Shecurity.xcworkspace -scheme Shecurity -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && ok=0 || ok=$?
          grep -E "error:|error -" build.log | sort -u | head -60
          tail -5 build.log
          [ $ok = 0 ] || exit $ok
          xcodebuild -project Shecurity.xcodeproj -target ShecurityWatch -configuration Debug -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO build > watch.log 2>&1 && ok=0 || ok=$?
          grep -E "error:|error -" watch.log | sort -u | head -60
          tail -5 watch.log
          exit $ok
