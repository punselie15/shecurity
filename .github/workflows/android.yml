name: Android build
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unsigned release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Publish the bundle to the android-dist branch
        run: |
          mkdir -p /tmp/dist && cp android/app/build/outputs/bundle/release/*.aab /tmp/dist/Shecurity-unsigned.aab
          cp android/wear/build/outputs/bundle/release/*.aab /tmp/dist/Shecurity-wear-unsigned.aab
          cd /tmp/dist && git init -q && git checkout -q -b android-dist
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -q -m "Android bundle from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-dist
