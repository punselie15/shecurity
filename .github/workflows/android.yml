name: Android build
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Get the web app from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Put the web app inside the Android app
        run: |
          rm -rf android/app/src/main/assets/www && mkdir -p android/app/src/main/assets/www
          (cd site/app && tar cf - --exclude=voices --exclude=sw.js .) | tar xf - -C android/app/src/main/assets/www
          ls android/app/src/main/assets/www
      - name: Add the Firebase config when it is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "Firebase on"; else echo "Firebase not set, alerts only while open"; fi
      - name: Build unsigned release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Publish the bundle to the android-dist branch
        run: |
          mkdir -p /tmp/dist && cp android/app/build/outputs/bundle/release/*.aab /tmp/dist/Shecurity-unsigned.aab
          cp android/wear/build/outputs/bundle/release/*.aab /tmp/dist/Shecurity-wear-unsigned.aab
          cd /tmp/dist && git init -q && git checkout -q -b android-dist
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -q -m "Android bundle from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-dist
